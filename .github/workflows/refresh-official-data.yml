name: Refresh official Atlas data

on:
  workflow_dispatch:
  push:
    branches:
      - feat/atlas-minero-v0-data-spine
    paths:
      - .github/workflows/refresh-official-data.yml
      - R/refresh_official_data.R
      - R/load_sources.R
      - R/clean_projects.R
      - R/validate_projects.R
      - R/build_spatial_projects.R
      - scripts/refresh_data.R

permissions:
  contents: read

jobs:
  live-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Install geospatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Install refresh dependencies
        shell: Rscript {0}
        run: |
          install.packages(c(
            "dplyr",
            "stringr",
            "readr",
            "readxl",
            "sf"
          ))

      - name: Diagnose official province geometry
        shell: Rscript {0}
        run: |
          source("R/load_sources.R")
          source("R/refresh_official_data.R")

          provinces <- read_argentina_provinces(ATLAS_PROVINCES_URL)
          cat("Province geometry diagnostic\n")
          cat("features:", nrow(provinces), "\n")

          geos_reason <- sf::st_is_valid(provinces, reason = TRUE)
          geos_invalid <- which(is.na(geos_reason) | geos_reason != "Valid Geometry")

          cat("GEOS invalid features:", length(geos_invalid), "\n")
          if (length(geos_invalid) > 0) {
            print(data.frame(
              row = geos_invalid,
              id = as.character(provinces$id[geos_invalid]),
              in1 = if ("in1" %in% names(provinces)) as.character(provinces$in1[geos_invalid]) else NA_character_,
              nombre = as.character(provinces$nombre[geos_invalid]),
              reason = geos_reason[geos_invalid],
              stringsAsFactors = FALSE
            ))
          }

          probe_point <- sf::st_sfc(sf::st_point(c(0, 0)), crs = 4326)
          s2_errors <- lapply(seq_len(nrow(provinces)), function(index) {
            tryCatch(
              {
                sf::st_within(probe_point, provinces[index, ])
                NULL
              },
              error = function(error) conditionMessage(error)
            )
          })

          s2_invalid <- which(vapply(s2_errors, function(value) !is.null(value), logical(1)))
          cat("s2-invalid features:", length(s2_invalid), "\n")
          if (length(s2_invalid) > 0) {
            print(data.frame(
              row = s2_invalid,
              id = as.character(provinces$id[s2_invalid]),
              in1 = if ("in1" %in% names(provinces)) as.character(provinces$in1[s2_invalid]) else NA_character_,
              nombre = as.character(provinces$nombre[s2_invalid]),
              error = vapply(s2_errors[s2_invalid], identity, character(1)),
              stringsAsFactors = FALSE
            ))
          }

          planar <- sf::st_set_crs(provinces, NA)
          geos_repaired <- tryCatch(
            sf::st_make_valid(planar),
            error = function(error) error
          )

          if (inherits(geos_repaired, "error")) {
            cat("GEOS planar repair candidate failed:", conditionMessage(geos_repaired), "\n")
          } else {
            geos_repaired <- sf::st_set_crs(geos_repaired, 4326)
            repaired_reason <- sf::st_is_valid(geos_repaired, reason = TRUE)
            repaired_invalid <- which(is.na(repaired_reason) | repaired_reason != "Valid Geometry")
            repaired_types <- unique(as.character(sf::st_geometry_type(geos_repaired)))

            repaired_s2_errors <- lapply(seq_len(nrow(geos_repaired)), function(index) {
              tryCatch(
                {
                  sf::st_within(probe_point, geos_repaired[index, ])
                  NULL
                },
                error = function(error) conditionMessage(error)
              )
            })
            repaired_s2_invalid <- which(vapply(
              repaired_s2_errors,
              function(value) !is.null(value),
              logical(1)
            ))

            cat("GEOS planar repair candidate features:", nrow(geos_repaired), "\n")
            cat("GEOS planar repair candidate GEOS invalid:", length(repaired_invalid), "\n")
            cat("GEOS planar repair candidate s2-invalid:", length(repaired_s2_invalid), "\n")
            cat("GEOS planar repair candidate geometry types:", paste(repaired_types, collapse = ", "), "\n")
          }

      - name: Diagnose raw IGN WFS geometry
        shell: Rscript {0}
        run: |
          source("R/load_sources.R")

          raw_ign_url <- paste0(
            "https://wms.ign.gob.ar/geoserver/ows?service=WFS&version=2.0.0&request=GetFeature",
            "&typeNames=ign:provincia&outputFormat=application%2Fjson&srsName=EPSG%3A4326"
          )
          provinces <- read_argentina_provinces(raw_ign_url)
          probe_point <- sf::st_sfc(sf::st_point(c(0, 0)), crs = 4326)

          geos_reason <- sf::st_is_valid(provinces, reason = TRUE)
          geos_invalid <- which(is.na(geos_reason) | geos_reason != "Valid Geometry")
          s2_errors <- lapply(seq_len(nrow(provinces)), function(index) {
            tryCatch(
              {
                sf::st_within(probe_point, provinces[index, ])
                NULL
              },
              error = function(error) conditionMessage(error)
            )
          })
          s2_invalid <- which(vapply(s2_errors, function(value) !is.null(value), logical(1)))

          cat("Raw IGN WFS geometry diagnostic\n")
          cat("features:", nrow(provinces), "\n")
          cat("GEOS invalid features:", length(geos_invalid), "\n")
          cat("s2-invalid features:", length(s2_invalid), "\n")
          cat("columns:", paste(names(provinces), collapse = ", "), "\n")
          cat("first names:", paste(utils::head(as.character(provinces$nombre), 3), collapse = " | "), "\n")
          if ("in1" %in% names(provinces)) {
            cat("first in1 codes:", paste(utils::head(as.character(provinces$in1), 3), collapse = " | "), "\n")
          }
          if ("id" %in% names(provinces)) {
            cat("first id values:", paste(utils::head(as.character(provinces$id), 3), collapse = " | "), "\n")
          }

          if (nrow(provinces) != 24) {
            stop(sprintf("Raw IGN WFS must return 24 jurisdictions; received %s", nrow(provinces)))
          }

      - name: Refresh from official public sources
        shell: Rscript {0}
        run: |
          source("R/load_sources.R")
          source("R/clean_projects.R")
          source("R/validate_projects.R")
          source("R/build_spatial_projects.R")
          source("scripts/refresh_data.R")
          source("R/refresh_official_data.R")

          output_dir <- file.path("artifacts", "processed")
          result <- refresh_official_atlas_data(output_dir = output_dir)

          required_paths <- unname(result$paths)
          if (!all(file.exists(required_paths))) {
            stop("Live refresh did not create all required Atlas artifacts")
          }
          if (any(file.info(required_paths)$size <= 0)) {
            stop("Live refresh created an empty Atlas artifact")
          }

          projects <- sf::st_read(
            file.path(output_dir, "projects.geojson"),
            quiet = TRUE
          )
          metadata <- readr::read_csv(
            file.path(output_dir, "metadata.csv"),
            show_col_types = FALSE
          )

          if (nrow(projects) == 0) {
            stop("Live official Atlas project dataset is empty")
          }

          cat("Atlas live refresh summary\n")
          cat("projects:", nrow(projects), "\n")
          cat("spatial provinces:", length(unique(stats::na.omit(projects$spatial_province))), "\n")
          cat("province mismatches:", sum(projects$province_match %in% FALSE, na.rm = TRUE), "\n")
          cat("unmatched province comparisons:", sum(is.na(projects$province_match)), "\n")
          cat("validation issues:", nrow(result$issues), "\n")
          print(metadata)

      - name: Upload processed Atlas artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-official-processed
          path: artifacts/processed
          if-no-files-found: error
          retention-days: 7
