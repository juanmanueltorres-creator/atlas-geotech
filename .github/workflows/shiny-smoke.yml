name: Shiny real-data smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/atlas-dark-theme
      - feat/atlas-minero-v0-data-spine
      - feat/atlas-company-lens
    paths:
      - .github/workflows/shiny-smoke.yml
      - app.R
      - R/build_atlas_app.R
      - R/filter_projects.R
      - R/read_processed_data.R
      - R/run_atlas_app.R
      - data/processed/**

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Install geospatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Install Shiny runtime dependencies
        shell: Rscript {0}
        run: |
          install.packages(c(
            "dplyr",
            "stringr",
            "readr",
            "sf",
            "shiny",
            "leaflet",
            "chromote"
          ))

      - name: Start Atlas Shiny app
        shell: bash
        run: |
          mkdir -p artifacts
          Rscript -e 'shiny::runApp(".", host="127.0.0.1", port=3838, launch.browser=FALSE)' \
            > artifacts/shiny.log 2>&1 &
          echo $! > artifacts/shiny.pid

      - name: Wait for local HTTP response
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3838/ > artifacts/index.html; then
              echo "Atlas Shiny responded on attempt ${attempt}."
              exit 0
            fi
            sleep 2
          done

          echo "Atlas Shiny did not become ready."
          cat artifacts/shiny.log || true
          exit 1

      - name: Verify Company Lens in browser and capture screenshot
        shell: Rscript {0}
        run: |
          browser <- chromote::ChromoteSession$new()
          on.exit(browser$close(), add = TRUE)

          evaluate_value <- function(expression) {
            result <- browser$Runtime$evaluate(
              expression = expression,
              returnByValue = TRUE
            )
            result$result$value
          }

          wait_for_value <- function(expression, predicate, attempts = 45L) {
            value <- NULL
            for (attempt in seq_len(attempts)) {
              value <- evaluate_value(expression)
              if (isTRUE(predicate(value))) {
                return(value)
              }
              Sys.sleep(1)
            }
            value
          }

          browser$Page$navigate("http://127.0.0.1:3838/")

          marker_expression <- paste(
            "(() => {",
            "const mapPane = document.querySelector('#map .leaflet-map-pane');",
            "const marks = document.querySelectorAll('#map .leaflet-interactive');",
            "return mapPane ? marks.length : 0;",
            "})()"
          )

          initial_marker_count <- wait_for_value(
            marker_expression,
            function(value) {
              !is.null(value) && !is.na(as.integer(value)) && as.integer(value) > 0L
            }
          )
          initial_marker_count <- as.integer(initial_marker_count)

          if (is.na(initial_marker_count) || initial_marker_count <= 0L) {
            stop("Leaflet map did not render any interactive project features")
          }

          cat("Initial Leaflet interactive features:", initial_marker_count, "\n")

          origin_values <- wait_for_value(
            paste(
              "(() => Array.from(document.querySelectorAll('#capital_origin option'))",
              ".map(option => option.value))()"
            ),
            function(value) length(unlist(value)) > 1L
          )
          origin_values <- unlist(origin_values, use.names = FALSE)

          if ("-" %in% origin_values) {
            stop("Company Lens exposed SIACAM '-' placeholder as a capital-origin choice")
          }

          real_origins <- origin_values[
            nzchar(origin_values) & origin_values != "Todos"
          ]
          if (length(real_origins) == 0L) {
            stop("Company Lens did not expose any real capital-origin choices")
          }

          selected_origin <- real_origins[[1]]
          cat("Testing capital origin:", selected_origin, "\n")

          browser$Runtime$evaluate(
            expression = sprintf(
              "Shiny.setInputValue('capital_origin', %s, {priority: 'event'})",
              jsonlite::toJSON(selected_origin, auto_unbox = TRUE)
            ),
            returnByValue = TRUE
          )

          count_text <- wait_for_value(
            "document.querySelector('#project_count')?.textContent?.trim() || ''",
            function(value) {
              is.character(value) && length(value) == 1L && grepl("^[0-9]+ proyecto", value)
            }
          )
          filtered_count <- suppressWarnings(as.integer(sub(" .*", "", count_text)))

          if (is.na(filtered_count) || filtered_count <= 0L) {
            stop("Capital-origin filter returned no valid project count")
          }
          if (filtered_count >= initial_marker_count) {
            stop("Capital-origin filter did not reduce the real 331-project view")
          }

          filtered_marker_count <- wait_for_value(
            marker_expression,
            function(value) {
              count <- suppressWarnings(as.integer(value))
              !is.na(count) && count == filtered_count
            }
          )
          filtered_marker_count <- as.integer(filtered_marker_count)

          if (is.na(filtered_marker_count) || filtered_marker_count != filtered_count) {
            stop("Leaflet marker count did not converge to the reactive project count")
          }

          clicked <- evaluate_value(paste(
            "(() => {",
            "const mark = document.querySelector('#map .leaflet-interactive');",
            "if (!mark) return false;",
            "mark.dispatchEvent(new MouseEvent('click', {bubbles: true, view: window}));",
            "return true;",
            "})()"
          ))
          if (!isTRUE(clicked)) {
            stop("Could not click a filtered project marker")
          }

          popup_text <- wait_for_value(
            "document.querySelector('.leaflet-popup-content')?.textContent || ''",
            function(value) {
              is.character(value) && length(value) == 1L && grepl("Controlantes", value, fixed = TRUE)
            }
          )
          if (!is.character(popup_text) || !grepl("Controlantes", popup_text, fixed = TRUE)) {
            stop("Filtered project popup did not expose Company Lens controller context")
          }

          cat("Filtered projects:", filtered_count, "\n")
          cat("Popup controller context verified.\n")

          writeLines(as.character(initial_marker_count), "artifacts/leaflet-feature-count.txt")
          writeLines(as.character(filtered_count), "artifacts/company-lens-filtered-count.txt")
          writeLines(selected_origin, "artifacts/company-lens-origin.txt")
          writeLines(popup_text, "artifacts/company-lens-popup.txt")

          browser$screenshot(filename = "artifacts/atlas-shiny.png")

          if (!file.exists("artifacts/atlas-shiny.png") ||
              file.info("artifacts/atlas-shiny.png")$size <= 0) {
            stop("Shiny screenshot was not created")
          }

      - name: Upload Shiny smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-shiny-smoke
          path: |
            artifacts/atlas-shiny.png
            artifacts/index.html
            artifacts/shiny.log
            artifacts/leaflet-feature-count.txt
            artifacts/company-lens-filtered-count.txt
            artifacts/company-lens-origin.txt
            artifacts/company-lens-popup.txt
          if-no-files-found: error
          retention-days: 7
