name: R CI

on:
  push:
    branches:
      - main
      - feat/atlas-minero-v0-data-spine
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Install geospatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Install test dependencies
        shell: Rscript {0}
        run: |
          install.packages(c(
            "testthat",
            "dplyr",
            "stringr",
            "readr",
            "readxl",
            "writexl",
            "sf"
          ))

      - name: Run contract tests
        run: Rscript tests/testthat.R
