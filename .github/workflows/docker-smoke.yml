name: Render Docker smoke

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "app.R"
      - "R/**"
      - "data/processed/**"
      - ".github/workflows/docker-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "app.R"
      - "R/**"
      - "data/processed/**"
      - ".github/workflows/docker-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Render image
        run: docker build --progress=plain -t atlas-geotech:render .

      - name: Start container with Render-style PORT
        run: |
          docker run -d \
            --name atlas-geotech-render \
            -e PORT=10000 \
            -p 10000:10000 \
            atlas-geotech:render

      - name: Wait for HTTP response
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/ > /tmp/atlas-index.html; then
              echo "Container responded on attempt ${attempt}."
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become ready."
          docker logs atlas-geotech-render || true
          exit 1

      - name: Verify Atlas app shell
        run: grep -q "Atlas Geotech" /tmp/atlas-index.html

      - name: Show container logs on failure
        if: failure()
        run: docker logs atlas-geotech-render || true

      - name: Stop container
        if: always()
        run: docker rm -f atlas-geotech-render || true
